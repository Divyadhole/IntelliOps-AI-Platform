[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelliops"
version = "0.1.0"
description = "Enterprise AI Intelligence Platform: predictive analytics + LLM decision engine for customer risk, behaviour and operations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Divyadhole"}]
keywords = ["machine-learning", "mlops", "churn-prediction", "nlp", "rag", "llm", "data-engineering"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.black]
line-length = 110
target-version = ["py310"]

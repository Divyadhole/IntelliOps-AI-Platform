name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests dashboard

      - name: Test
        env:
          PYTHONPATH: src
        run: pytest --cov=intelliops --cov-report=term-missing

  end-to-end:
    name: End-to-end platform run
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the full platform on synthetic data
        env:
          PYTHONPATH: src
        run: |
          python -m intelliops.data_pipeline.run_pipeline
          python -m intelliops.churn_model.train
          python -m intelliops.churn_model.segmentation
          python -m intelliops.nlp_engine.run_nlp
          python -m intelliops.rag_assistant.retriever

      # A model whose ROC-AUC silently regresses is the failure mode that reaches
      # production unnoticed, so CI asserts a floor on it rather than only on tests.
      - name: Enforce model quality gate (ROC-AUC ≥ 0.78)
        run: |
          python - <<'PY'
          import json, sys
          report = json.load(open("artifacts/reports/model_report.json"))
          auc = report["final_metrics"]["roc_auc"]
          print(f"Selected {report['selected_model']} · ROC-AUC {auc:.4f}")
          sys.exit(0 if auc >= 0.78 else f"Quality gate failed: ROC-AUC {auc:.4f} < 0.78")
          PY

      - name: Smoke-test the API
        env:
          PYTHONPATH: src
        run: |
          uvicorn intelliops.api.main:app --port 8000 &
          for i in {1..30}; do curl -fsS localhost:8000/health && break || sleep 2; done
          curl -fsS -X POST localhost:8000/predict_churn \
            -H 'content-type: application/json' \
            -d '{"tenure":2,"MonthlyCharges":95.4,"Contract":"Month-to-month"}' | tee /dev/stderr | grep -q churn_probability

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-reports
          path: artifacts/reports/
          retention-days: 14

  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
